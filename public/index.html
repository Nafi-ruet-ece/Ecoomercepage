<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f0f2f5;
      padding: 20px;
    }

    .login-container {
      background: #ffffff;
      padding: 40px 32px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 400px;
    }

    .login-header {
      margin-bottom: 28px;
      text-align: center;
    }

    .login-header h1 {
      font-size: 24px;
      font-weight: 600;
      color: #1a1a1a;
      margin-bottom: 8px;
    }

    .login-header p {
      font-size: 14px;
      color: #65676b;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: #333333;
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      padding: 12px 14px;
      font-size: 14px;
      border: 1px solid #ccd0d5;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-group input:focus {
      border-color: #1877f2;
      box-shadow: 0 0 0 3px rgba(24, 119, 242, 0.2);
    }

    .btn-login {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      font-weight: 600;
      color: #ffffff;
      background-color: #1877f2;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-login:hover:not(:disabled) {
      background-color: #166fe5;
    }

    .btn-login:disabled {
      background-color: #93bcf8;
      cursor: not-allowed;
    }

    .switch-link {
      margin-top: 20px;
      text-align: center;
      font-size: 14px;
      color: #65676b;
    }

    .switch-link a {
      color: #1877f2;
      text-decoration: none;
      font-weight: 500;
    }

    .switch-link a:hover {
      text-decoration: underline;
    }

    .message {
      margin-top: 16px;
      padding: 12px;
      border-radius: 6px;
      font-size: 14px;
      line-height: 1.4;
      text-align: left;
      display: none;
      word-break: break-word;
    }

    .message.success {
      background-color: #e7f7ed;
      color: #0e7039;
      border: 1px solid #a3e0b8;
    }

    .message.error {
      background-color: #fde8e8;
      color: #c81e1e;
      border: 1px solid #f8b4b4;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-header">
      <h1>Welcome Back</h1>
      <p>Please enter your credentials to login</p>
    </div>

    <form id="loginForm" action="/login" method="POST">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter password" required>
      </div>

      <button type="submit" id="loginBtn" class="btn-login">Log In</button>
      <div id="message" class="message"></div>

      <p class="switch-link">Don't have an account? <a href="/signup">Sign up</a></p>
    </form>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const message = document.getElementById('message');
    const loginBtn = document.getElementById('loginBtn');

    function showMessage(type, text) {
      message.className = `message ${type}`;
      message.textContent = text;
      message.style.display = 'block';
    }

    function hideMessage() {
      message.style.display = 'none';
      message.textContent = '';
      message.className = 'message';
    }

    // Display URL query feedback if present
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.has('registered')) {
      showMessage('success', 'Account created successfully! Please log in.');
    } else if (urlParams.has('error')) {
      showMessage('error', decodeURIComponent(urlParams.get('error')));
    } else if (urlParams.has('login_success')) {
      const user = urlParams.get('user') || 'User';
      showMessage('success', `Welcome back, ${decodeURIComponent(user)}! Login successful.`);
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      hideMessage();

      const email = form.email.value.trim();
      const password = form.password.value;

      if (!email || !password) {
        showMessage('error', 'Please enter both email and password.');
        return;
      }

      loginBtn.disabled = true;
      loginBtn.textContent = 'Logging in...';

      try {
        const response = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();
        if (response.ok && data.success) {
          showMessage('success', `Welcome back, ${data.user.name || data.user.email}! Login successful.`);
        } else {
          showMessage('error', data.error || 'Invalid email or password.');
        }
      } catch (err) {
        showMessage('error', 'An error occurred during login. Please try again.');
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = 'Log In';
      }
    });
  </script>
</body>
</html>
